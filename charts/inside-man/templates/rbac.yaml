{{- if .Values.bff.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inside-man.fullname" . }}-bff
  labels:
    {{- include "inside-man.labels" . | nindent 4 }}
---
# Read-only, and only the objects the services list joins onto. The BFF never
# writes to the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "inside-man.fullname" . }}-bff
  labels:
    {{- include "inside-man.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "inside-man.fullname" . }}-bff
  labels:
    {{- include "inside-man.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "inside-man.fullname" . }}-bff
subjects:
  - kind: ServiceAccount
    name: {{ include "inside-man.fullname" . }}-bff
    namespace: {{ .Release.Namespace }}
{{- end }}
