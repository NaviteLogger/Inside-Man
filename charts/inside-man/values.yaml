# Default values for Inside Man. This is the "small" profile.
# For HA, install with -f values-ha.yaml.

insideMan:
  clusterName: inside-man

  # Health thresholds (design doc 5.2). Override per service with the
  # insideman.io/slo-p95 annotation.
  health:
    errorRateWarn: 0.01
    errorRateCrit: 0.05
    p95WarnSeconds: 0.5

  instrumentation:
    enabled: true
    # Go is excluded, see docs/decisions/0007-demo-app-languages.md
    languages: [java, nodejs, python, dotnet]
    samplerType: parentbased_traceidratio
    samplerArg: "1.0"

# Our API server. See docs/decisions/0001-bff-in-go.md.
bff:
  enabled: true
  replicas: 1
  image:
    repository: inside-man-bff
    tag: local
    pullPolicy: IfNotPresent
  prometheusURL: http://inside-man-prometheus.inside-man.svc:80
  lokiURL: http://inside-man-loki-gateway.inside-man.svc:80
  tempoURL: http://inside-man-tempo.inside-man.svc:3200
  # Every rate() and histogram_quantile uses this window.
  queryWindow: 5m
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# The service-centric front end.
ui:
  enabled: true
  replicas: 1
  image:
    repository: inside-man-ui
    tag: local
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    nodePort: 30080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# One login in front of both the UI and Grafana. Off by default so a fresh
# install works with no identity provider, which is what the quick start and
# the e2e suite rely on. See docs/auth.md before turning it on.
oauth2-proxy:
  enabled: false
  config:
    # Set clientID, clientSecret and cookieSecret through
    # existingSecret, so they never live in a values file.
    existingSecret: ""
  extraArgs:
    provider: oidc
    # The UI is the upstream; Grafana is reached through its own route.
    upstream: http://inside-man-ui.inside-man.svc:80
    email-domain: "*"
    # Grafana trusts this header when auth.proxy is enabled, so a single
    # sign-in covers both surfaces.
    set-xauthrequest: "true"
    pass-user-headers: "true"
  ingress:
    enabled: false

# Ingest. See docs/decisions/0003-use-k8s-monitoring-chart.md for why this
# chart replaces a hand-written Alloy config and a separate OTel Collector.
k8s-monitoring:
  enabled: true

  cluster:
    name: inside-man

  # Defaults to on and reports usage to Grafana Cloud.
  selfReporting:
    enabled: false

  # v4 requires named Alloy instances, and each feature picks one. Three,
  # because they have different shapes: cluster-wide scraping has to be a
  # singleton or metrics double-count, log tailing has to be a DaemonSet to
  # reach each node's filesystem, and the OTLP gateway is a plain Deployment.
  collectors:
    singleton:
      presets: [singleton, small]
    logs:
      presets: [daemonset, filesystem-log-reader, host-storage, small]
      alloy:
        # podLogsViaOpenTelemetry uses otelcol.receiver.filelog, which Alloy
        # classes as public-preview. See docs/decisions/0011-otlp-pod-logs.md.
        stabilityLevel: public-preview
    receiver:
      presets: [deployment, small]

  destinations:
    metrics:
      type: prometheus
      url: http://inside-man-prometheus.inside-man.svc:80/api/v1/write
      auth: { type: none }

    logs:
      # OTLP, where Loki's native push API would need more work. Loki promotes
      # attributes to index labels, so service.name arrives as service_name
      # and matches what traces carry, and trace_id arrives as structured
      # metadata. That is the join key, for free. See docs/join-key.md.
      type: otlp
      url: http://inside-man-loki-gateway.inside-man.svc:80/otlp
      protocol: http
      auth: { type: none }
      metrics: { enabled: false }
      logs: { enabled: true }
      traces: { enabled: false }

    traces:
      type: otlp
      url: inside-man-tempo.inside-man.svc:4317
      protocol: grpc
      tls: { insecure: true }
      auth: { type: none }
      metrics: { enabled: false }
      logs: { enabled: false }
      traces: { enabled: true }
      processors:
        serviceGraphMetrics:
          enabled: true
          dimensions:
            - service.namespace
            - k8s.namespace.name
            - k8s.cluster.name

  clusterMetrics:
    enabled: true
    collector: singleton
    kube-state-metrics:
      enabled: true

  clusterEvents:
    enabled: true
    collector: singleton

  podLogsViaOpenTelemetry:
    enabled: true
    collector: logs

  applicationObservability:
    enabled: true
    collector: receiver
    receivers:
      otlp:
        grpc: { enabled: true, port: 4317 }
        http: { enabled: true, port: 4318 }
    processors:
      k8sattributes:
        # Off until collector-contrib #47534 is confirmed fixed. That
        # regression broke resource.opentelemetry.io/service.name taking
        # precedence over app.kubernetes.io/name.
        otelAnnotations: false
    connectors:
      spanMetrics:
        enabled: true
        # Set explicitly. Alloy's default namespace produces
        # traces_span_metrics_* while Tempo's generator produces
        # traces_spanmetrics_*, and queries need one name.
        namespace: traces.spanmetrics
        # Cardinality budget, see docs/join-key.md.
        aggregationCardinalityLimit: 1000
        dimensions:
          - name: service.namespace
          - name: k8s.namespace.name
          - name: k8s.cluster.name
        histogram:
          enabled: true
          type: explicit
          unit: s

  # This chart scrapes them, so it deploys them. The Prometheus chart's own
  # copies are disabled below.
  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

opentelemetry-operator:
  enabled: true
  manager:
    collectorImage:
      repository: otel/opentelemetry-collector-k8s
  admissionWebhooks:
    certManager:
      # Avoids making cert-manager a prerequisite.
      enabled: false
    autoGenerateCert:
      enabled: true
      # Defaults to true, which mints a new webhook cert on every helm upgrade
      # while the running operator pod keeps serving the old one. Any upgrade
      # that touches the Instrumentation CR then fails its webhook call with
      # "certificate signed by unknown authority".
      recreate: false

# Metrics. Prometheus for small, Mimir for HA.
# See docs/decisions/0002-prometheus-default-mimir-for-ha.md.
prometheus:
  enabled: true
  server:
    fullnameOverride: inside-man-prometheus
    retention: 15d
    # extraFlags carries argumentless flags. The chart's extraArgs map cannot
    # express one: a null value in a values file is a delete instruction to
    # Helm's coalescing, so the key never reaches the template.
    # web.enable-lifecycle is the chart default and has to be repeated, since
    # Helm replaces lists over merging them.
    extraFlags:
      - web.enable-lifecycle
      # How Alloy's prometheus destination writes to us.
      - web.enable-remote-write-receiver
    persistentVolume:
      enabled: true
      size: 20Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
  # k8s-monitoring deploys these.
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  alertmanager:
    enabled: true

mimir-distributed:
  enabled: false

# Logs.
loki:
  enabled: true
  fullnameOverride: inside-man-loki
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      # Needed to query trace_id as structured metadata.
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 336h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
  # Both memcached tiers default on and ask for 8Gi of heap between them.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  backend: { replicas: 0 }
  read: { replicas: 0 }
  write: { replicas: 0 }

# Traces.
tempo:
  enabled: true
  fullnameOverride: inside-man-tempo
  tempo:
    reportingEnabled: false
    retention: 168h
    # Alloy generates span metrics and service graph edges. Enabling this
    # too would double-count every metric.
    metricsGenerator:
      enabled: false
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
  persistence:
    enabled: true
    size: 20Gi

# Never enable this alongside tempo. Both charts define a tempo.labels helper
# and the two collide at render time.
tempo-distributed:
  enabled: false

grafana:
  enabled: true
  fullnameOverride: inside-man-grafana
  adminUser: admin
  service:
    type: NodePort
    nodePort: 30030
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # We provision from this chart, so the sidecar has nothing to watch for.
  sidecar:
    dashboards: { enabled: false }
    datasources: { enabled: false }

  # Datasources and the links between them, provisioned as code. This is what
  # makes M1's promise true: a trace reaches its logs and its RED metrics with
  # nobody clicking through Grafana settings.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://inside-man-prometheus.inside-man.svc:80
          isDefault: true
          jsonData:
            timeInterval: 30s

        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://inside-man-loki-gateway.inside-man.svc:80
          jsonData:
            # Alloy collects container stdout, so a log record's OTLP TraceId
            # field is never set and Loki has no trace id in structured
            # metadata. The id an application prints lives in the body, which
            # is what this pattern picks up. See docs/join-key.md.
            derivedFields:
              - name: TraceID
                matcherType: regex
                matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
                url: '${__value.raw}'
                datasourceUid: tempo
                urlDisplayLabel: View trace

        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://inside-man-tempo.inside-man.svc:3200
          jsonData:
            # Trace to logs. service.name on the span becomes the service_name
            # label on the log stream, which is the join key doing its job.
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
              filterByTraceID: true
              tags:
                - key: service.name
                  value: service_name

            # Trace to RED metrics. The label is service_name, because Alloy
            # generates these and Tempo's metrics-generator stays off.
            tracesToMetrics:
              datasourceUid: prometheus
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
              tags:
                - key: service.name
                  value: service_name
              queries:
                - name: Request rate
                  query: sum by (service_name) (rate(traces_spanmetrics_calls_total{$__tags}[5m]))
                - name: Error rate
                  query: sum by (service_name) (rate(traces_spanmetrics_calls_total{$__tags,status_code="STATUS_CODE_ERROR"}[5m]))
                - name: p95 duration
                  query: histogram_quantile(0.95, sum by (service_name, le) (rate(traces_spanmetrics_duration_seconds_bucket{$__tags}[5m])))

            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            search:
              hide: false
            traceQuery:
              timeShiftEnabled: true
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
