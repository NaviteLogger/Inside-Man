# Inside Man — default values (the "small" profile).
#
# Keep this surface small. Anything a platform engineer should not need to think
# about belongs in the sub-chart defaults, not here.
#
# For the HA profile, install with `-f values-ha.yaml`.

# ── Inside Man's own knobs ────────────────────────────────────────────────────
insideMan:
  # Cluster name stamped onto every signal. Shows up as a label everywhere.
  clusterName: inside-man

  # Health thresholds (design doc §5.2). Deliberately dumb in v1 — no anomaly
  # detection. Overridable per service via the insideman.io/slo-p95 annotation.
  health:
    errorRateWarn: 0.01
    errorRateCrit: 0.05
    p95WarnSeconds: 0.5

  # Languages to auto-instrument via the OpenTelemetry Operator.
  # Go is deliberately absent: its operator path needs a privileged eBPF
  # sidecar, cannot handle multi-container pods, and upstream has moved to OBI.
  # See docs/decisions/0007-demo-app-languages.md.
  instrumentation:
    enabled: true
    languages: [java, nodejs, python, dotnet]
    # Sampling: 100% in the small profile — these are dev/small clusters.
    samplerType: parentbased_traceidratio
    samplerArg: "1.0"

# ── Auth ──────────────────────────────────────────────────────────────────────
# Off by default so `helm install` gives a working stack with no IdP. Turn on
# for anything shared. Documented in docs/auth.md.
oauth2-proxy:
  enabled: false

# ── Ingest: Alloy, via Grafana's k8s-monitoring chart ─────────────────────────
# This one chart replaces both a hand-written Alloy config and a separate OTel
# Collector deployment. See docs/decisions/0003-use-k8s-monitoring-chart.md.
k8s-monitoring:
  enabled: true

  cluster:
    name: inside-man

  # Usage telemetry aimed at Grafana Cloud. Off — this is a self-hosted product.
  selfReporting:
    enabled: false

  # v4 requires explicitly named Alloy instances, and every feature names the
  # collector it runs on. Three, because they have genuinely different shapes:
  #  - cluster-wide scraping must be a singleton or metrics double-count
  #  - pod log tailing must be a DaemonSet to reach each node's filesystem
  #  - the OTLP gateway is a plain scalable Deployment
  # On the single-node dev cluster the DaemonSet is one pod anyway.
  collectors:
    singleton:
      presets: [singleton, small]
    logs:
      presets: [daemonset, filesystem-log-reader, host-storage, small]
      alloy:
        # Required by podLogsViaOpenTelemetry, which uses
        # otelcol.receiver.filelog — public-preview in Alloy, though the
        # underlying OTel filelog receiver is long-standing. Accepted
        # deliberately: the OTLP log path is what makes Loki auto-promote
        # service.name to the service_name label, which is the whole join key.
        # See docs/decisions/0011-otlp-pod-logs.md.
        stabilityLevel: public-preview
    receiver:
      presets: [deployment, small]

  destinations:
    metrics:
      type: prometheus
      url: http://inside-man-prometheus.inside-man.svc:80/api/v1/write
      auth: { type: none }

    logs:
      # OTLP rather than the Loki-native push API, deliberately: Loki 3.x
      # auto-promotes OTLP resource attributes to index labels, so
      # service.name lands as service_name — matching the label traces carry —
      # and trace_id lands as structured metadata. That gives us the design
      # doc's §4.3 join key with no mapping table and no regex.
      # See docs/join-key.md.
      type: otlp
      url: http://inside-man-loki-gateway.inside-man.svc:80/otlp
      protocol: http
      auth: { type: none }
      metrics: { enabled: false }
      logs: { enabled: true }
      traces: { enabled: false }

    traces:
      type: otlp
      url: inside-man-tempo.inside-man.svc:4317
      protocol: grpc
      tls: { insecure: true }
      auth: { type: none }
      metrics: { enabled: false }
      logs: { enabled: false }
      traces: { enabled: true }
      processors:
        # Service-graph edges generated here rather than in Tempo, so they
        # survive a Tempo 2.x→3.0 migration untouched.
        serviceGraphMetrics:
          enabled: true
          dimensions:
            - service.namespace
            - k8s.namespace.name
            - k8s.cluster.name

  # Infrastructure metrics
  clusterMetrics:
    enabled: true
    collector: singleton
    kube-state-metrics:
      enabled: true

  clusterEvents:
    enabled: true
    collector: singleton

  # Pod logs over OTLP — see the `logs` destination comment above.
  podLogsViaOpenTelemetry:
    enabled: true
    collector: logs

  # Application telemetry: the OTLP gateway our auto-instrumented apps ship to.
  applicationObservability:
    enabled: true
    collector: receiver
    receivers:
      otlp:
        grpc: { enabled: true, port: 4317 }
        http: { enabled: true, port: 4318 }
    processors:
      k8sattributes:
        # NOTE: deliberately left off. A contrib regression (#47534) broke
        # resource.opentelemetry.io/service.name precedence over
        # app.kubernetes.io/name when this is on. Re-evaluate before enabling.
        otelAnnotations: false
    connectors:
      spanMetrics:
        enabled: true
        # Must be set explicitly. The Alloy default namespace would emit
        # traces_span_metrics_* while Tempo's generator emits
        # traces_spanmetrics_* — pinning it keeps BFF queries and dashboards
        # portable across both generation strategies.
        namespace: traces.spanmetrics
        # Cardinality budget (design doc §10's top risk). Anything beyond the
        # four intrinsic dimensions plus these is banned.
        aggregationCardinalityLimit: 1000
        dimensions:
          - name: service.namespace
          - name: k8s.namespace.name
          - name: k8s.cluster.name
        histogram:
          enabled: true
          type: explicit
          unit: s

  # We deploy kube-state-metrics and node-exporter here, not via the Prometheus
  # chart — this chart is the one that scrapes them.
  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

# ── Auto-instrumentation ──────────────────────────────────────────────────────
opentelemetry-operator:
  enabled: true
  manager:
    collectorImage:
      repository: otel/opentelemetry-collector-k8s
  admissionWebhooks:
    certManager:
      # Use the operator's self-signed cert generator rather than requiring
      # cert-manager as a prerequisite. One less thing to install.
      enabled: false
    autoGenerateCert:
      enabled: true

# ── Metrics store: Prometheus (small profile default) ─────────────────────────
prometheus:
  enabled: true
  server:
    fullnameOverride: inside-man-prometheus
    retention: 15d
    extraArgs:
      # Required — this is how Alloy's `prometheus` destination writes to us.
      web.enable-remote-write-receiver: null
    persistentVolume:
      enabled: true
      size: 20Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
  # Deployed by k8s-monitoring instead — enabling them here would duplicate
  # both the workloads and the metrics they produce.
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  alertmanager:
    enabled: true

# Mimir is the HA-profile metrics store. See values-ha.yaml.
mimir-distributed:
  enabled: false

# ── Log store: Loki, monolithic ───────────────────────────────────────────────
loki:
  enabled: true
  fullnameOverride: inside-man-loki
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      # Required for trace_id to be queryable as structured metadata.
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 336h  # 14d, per design doc §7
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
  # Memcached tiers default on and ask for 8 GiB of heap between them — far past
  # the design doc's "< 4 CPU / 8 GiB" budget for a small cluster.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  # Zero out the microservices topology so Monolithic mode is unambiguous.
  backend: { replicas: 0 }
  read: { replicas: 0 }
  write: { replicas: 0 }

# ── Trace store: Tempo, monolithic ────────────────────────────────────────────
tempo:
  enabled: true
  fullnameOverride: inside-man-tempo
  tempo:
    reportingEnabled: false
    retention: 168h  # 7d, per design doc §7
    # Left off on purpose: span metrics and service-graph edges are generated
    # client-side in Alloy. Enabling this too would double-count every metric.
    metricsGenerator:
      enabled: false
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
  persistence:
    enabled: true
    size: 20Gi

# tempo-distributed is the HA-profile trace store. It requires an external
# Kafka broker and object storage as of Tempo 3.0. See values-ha.yaml.
tempo-distributed:
  enabled: false

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  fullnameOverride: inside-man-grafana
  # Inside Man is the front door; Grafana is one click away for raw
  # PromQL/LogQL/TraceQL and for the bundled Drilldown apps.
  adminUser: admin
  service:
    type: NodePort
    nodePort: 30030
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # The sidecar would add a container per pod to watch for labelled ConfigMaps.
  # We provision from this chart instead, so it earns nothing.
  sidecar:
    dashboards: { enabled: false }
    datasources: { enabled: false }
