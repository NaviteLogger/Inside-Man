# HA profile.
#
#   helm install inside-man charts/inside-man -f charts/inside-man/values-ha.yaml
#
# This profile does not install two things it needs:
#
#   1. Object storage (S3 or GCS) for Mimir, Tempo and Loki. Tempo 3.0 dropped
#      the bundled MinIO subchart, so there is no built-in option.
#   2. A Kafka broker. Tempo 3.0 routes writes through Kafka, and block-builder,
#      live-store and metrics-generator all consume from it.
#
# Both are left blank below, so an install fails with a clear message and never
# comes up half-working.

# Retention. This profile has the storage to keep more, so the knob moves and
# the stores below follow it. templates/retention.yaml fails the render when
# they drift, which is how the 30d Loki setting below was caught disagreeing
# with the 14d default.
#
# Only logs are checked here. Traces and metrics are held by tempo-distributed
# and Mimir in this profile, and both manage retention through their own
# compactor settings against object storage, which the guard does not read.
insideMan:
  retention:
    logs: 30d

prometheus:
  enabled: false

mimir-distributed:
  enabled: true
  mimir:
    structuredConfig:
      common:
        storage:
          backend: s3
          s3: {}

tempo:
  enabled: false

tempo-distributed:
  enabled: true
  ingest:
    kafka:
      address: ""
  storage:
    trace:
      backend: s3
      s3: {}

k8s-monitoring:
  collectors:
    singleton:
      presets: [singleton, medium]
    logs:
      presets: [daemonset, filesystem-log-reader, host-storage, medium]
      alloy:
        stabilityLevel: public-preview
    receiver:
      # Clustered so the OTLP gateway scales out under load.
      presets: [deployment, clustered, medium]

  destinations:
    metrics:
      url: http://inside-man-mimir-nginx.inside-man.svc:80/api/v1/push
    traces:
      url: inside-man-tempo-distributor.inside-man.svc:4317

loki:
  loki:
    # Monolithic Loki above one replica requires object storage.
    storage:
      type: s3
      bucketNames:
        chunks: ""
        ruler: ""
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 720h
  singleBinary:
    replicas: 3
  # Worth the memory at this size.
  chunksCache:
    enabled: true
  resultsCache:
    enabled: true

grafana:
  replicas: 2
