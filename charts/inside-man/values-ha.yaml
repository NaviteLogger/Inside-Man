# Inside Man — HA profile.
#
#   helm install inside-man charts/inside-man -f charts/inside-man/values-ha.yaml
#
# ⚠ Prerequisites this profile does NOT install for you:
#
#   1. Object storage (S3/GCS) for Mimir and Tempo. Tempo 3.0 removed the MinIO
#      subchart, so there is no bundled option any more.
#   2. A Kafka-compatible broker. Tempo 3.0's microservices mode routes writes
#      through Kafka — the distributor produces to it, and block-builder,
#      live-store and metrics-generator all consume from it.
#
# Without both, this profile will not come up. The small profile has neither
# requirement, which is why it is the default.

# ── Metrics: Mimir replaces Prometheus ────────────────────────────────────────
prometheus:
  enabled: false

mimir-distributed:
  enabled: true
  # Point at your object storage. Left blank on purpose — an install should
  # fail loudly rather than quietly write somewhere useless.
  mimir:
    structuredConfig:
      common:
        storage:
          backend: s3
          s3: {}

# ── Traces: tempo-distributed replaces monolithic Tempo ───────────────────────
tempo:
  enabled: false

tempo-distributed:
  enabled: true
  # REQUIRED. Tempo 3.0's block-builder and live-store consume from Kafka and
  # will not start without it. Left empty deliberately: the chart fails the
  # render with a clear message rather than installing something broken.
  ingest:
    kafka:
      address: ""
  storage:
    trace:
      backend: s3
      s3: {}

# ── Ingest sized up ───────────────────────────────────────────────────────────
k8s-monitoring:
  collectors:
    singleton:
      presets: [singleton, medium]
    logs:
      presets: [daemonset, filesystem-log-reader, host-storage, medium]
      alloy:
        stabilityLevel: public-preview
    receiver:
      # Clustered so the OTLP gateway scales horizontally instead of being a
      # single choke point.
      presets: [deployment, clustered, medium]

  destinations:
    metrics:
      url: http://inside-man-mimir-nginx.inside-man.svc:80/api/v1/push
    traces:
      url: inside-man-tempo-distributor.inside-man.svc:4317

# ── Longer retention ──────────────────────────────────────────────────────────
loki:
  loki:
    # Monolithic Loki above 1 replica requires object storage — the chart
    # enforces this. Bucket names are left empty on purpose so a real install
    # fails loudly rather than writing nowhere useful.
    storage:
      type: s3
      bucketNames:
        chunks: ""
        ruler: ""
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 720h  # 30d
  singleBinary:
    replicas: 3
  # Caches are worth their memory at this size, unlike in the small profile.
  chunksCache:
    enabled: true
  resultsCache:
    enabled: true

grafana:
  replicas: 2
