apiVersion: v2
name: inside-man
description: Service-centric observability for Kubernetes, in one install.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/jhoareaumarion/Inside-Man
sources:
  - https://github.com/jhoareaumarion/Inside-Man
keywords:
  - observability
  - opentelemetry
  - tracing
  - logging
  - metrics

# Two Grafana chart repos are in play.
#
#   grafana-community.github.io  ->  grafana, loki, tempo, tempo-distributed
#   grafana.github.io            ->  k8s-monitoring, mimir-distributed
#
# Grafana Labs stopped hosting the grafana, loki and tempo charts. The ones
# left there are frozen at 2026-01-30, and the loki chart there is now the
# Enterprise Logs chart. Using them installs year-old software or the wrong
# product, with no error.
# See docs/decisions/0009-grafana-helm-chart-repo-split.md.
dependencies:
  # Ingest, still published by Grafana Labs.
  - name: k8s-monitoring
    version: 4.5.0
    repository: https://grafana.github.io/helm-charts
    condition: k8s-monitoring.enabled

  - name: opentelemetry-operator
    version: 0.122.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-operator.enabled

  # Metrics: Prometheus for small, Mimir for HA.
  - name: prometheus
    version: 29.27.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled

  - name: mimir-distributed
    version: 6.2.0
    repository: https://grafana.github.io/helm-charts
    condition: mimir-distributed.enabled

  # Logs.
  - name: loki
    version: 18.11.7
    repository: https://grafana-community.github.io/helm-charts
    condition: loki.enabled

  # Traces: monolithic for small, distributed for HA.
  - name: tempo
    version: 2.3.0
    repository: https://grafana-community.github.io/helm-charts
    condition: tempo.enabled

  - name: tempo-distributed
    version: 3.5.1
    repository: https://grafana-community.github.io/helm-charts
    condition: tempo-distributed.enabled

  # Visualisation and auth.
  - name: grafana
    version: 13.2.0
    repository: https://grafana-community.github.io/helm-charts
    condition: grafana.enabled

  - name: oauth2-proxy
    version: 10.7.0
    repository: https://oauth2-proxy.github.io/manifests
    condition: oauth2-proxy.enabled
