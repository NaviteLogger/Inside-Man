version: 2
updates:
  - package-ecosystem: gomod
    directory: /bff
    schedule: { interval: weekly }

  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      # Vite and Vitest move together, and splitting them produces PRs that
      # cannot pass on their own.
      build-tooling:
        patterns: ["vite", "vitest", "@vitejs/*"]

  - package-ecosystem: pip
    directory: /examples/demo-app/api
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories:
      - /bff
      - /ui
      - /examples/demo-app/api
      - /examples/demo-app/frontend
      - /examples/demo-app/backend
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  # The chart dependencies are the versions nobody was watching. ADR 0009
  # requires manual review here: grafana, loki and tempo come from a
  # community fork, and Loki's renumbering from 6.55 to 18.x is a repository
  # change that no bot will bridge correctly.
  - package-ecosystem: helm
    directory: /charts/inside-man
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chart"
