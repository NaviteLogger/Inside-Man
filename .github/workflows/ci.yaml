name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans commit history
      - name: Secret scan
        run: |
          bash scripts/bootstrap.sh gitleaks
          export PATH="$PWD/.tools/bin:$PATH"
          gitleaks dir . --config .gitleaks.toml --no-banner --redact
          gitleaks git . --config .gitleaks.toml --no-banner --redact

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Go vet and formatting
        run: |
          cd bff
          gofmt -l . | (! grep .)
          go vet ./...
      - name: Go tests
        run: cd bff && go test -race ./...
      - name: OpenAPI spec lint
        run: cd ui && npm ci && npm run lint-spec

      # The UI's types are generated from the spec, so a stale checked-in file
      # means the UI is typed against an API that no longer exists.
      - name: Generated types are current
        run: |
          cd ui
          npm run gen-types
          git diff --exit-code -- src/api-types.ts \
            || { echo "src/api-types.ts is stale, run 'npm run gen-types' in ui/"; exit 1; }

      - name: UI typecheck and tests
        run: |
          cd ui
          npm run typecheck
          npm test

  chart:
    name: Chart lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Helm lint
        run: |
          bash scripts/bootstrap.sh helm
          export PATH="$PWD/.tools/bin:$PATH"
          helm lint charts/inside-man
          bash -n scripts/*.sh

      # Helm renders from the vendored tarballs and ignores the version in
      # Chart.yaml, so a bump without the tarball is a no-op that still passes
      # lint and template.
      - name: Vendored charts match Chart.yaml
        run: bash scripts/check-vendored-charts.sh
      # Render both profiles, otherwise the HA path rots unnoticed.
      - name: Render default (small) profile
        run: make template
      # values-ha.yaml leaves Kafka and object storage blank so a real install
      # fails with a clear message. CI passes placeholders to check rendering.
      - name: Render ha profile
        run: |
          export PATH="$PWD/.tools/bin:$PATH"
          helm template inside-man charts/inside-man \
            --namespace inside-man -f charts/inside-man/values-ha.yaml \
            --set 'tempo-distributed.ingest.kafka.address=kafka.example.svc:9092' \
            --set 'loki.loki.storage.bucketNames.chunks=chunks' \
            --set 'loki.loki.storage.bucketNames.ruler=ruler' \
            > /dev/null

  e2e:
    name: e2e (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One version behind latest is the default, since upstream charts lag.
        # Latest is tested too, to catch breakage before users do.
        k8s: ["v1.36.4", "v1.37.0"]
    steps:
      - uses: actions/checkout@v7
      - name: Run end-to-end suite
        run: make e2e KIND_IMAGE=kindest/node:${{ matrix.k8s }}
      # An install that works from scratch says nothing about one upgraded in
      # place, which is where the operator's webhook cert and the gateway's
      # rolling update both broke.
      - name: Upgrade, rollback and verify data survived
        run: make upgrade-test

      - name: Dump cluster state on failure
        if: failure()
        run: |
          export PATH="$PWD/.tools/bin:$PATH" KUBECONFIG="$PWD/kubeconfig"
          kubectl get pods -A
          kubectl describe pods -n inside-man
          kubectl logs -n inside-man -l app.kubernetes.io/name=alloy --tail=200 --all-containers || true
