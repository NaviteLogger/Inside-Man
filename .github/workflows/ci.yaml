name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks needs history to scan commits
      - run: make secrets

  chart:
    name: Chart lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make lint
      # Both profiles must render, or the HA path rots unnoticed.
      - name: Render default (small) profile
        run: make template
      # The ha profile requires external Kafka and object storage, which we
      # deliberately leave blank in values-ha.yaml so a real install fails loudly.
      # CI supplies placeholders purely to prove the templates render.
      - name: Render ha profile
        run: |
          export PATH="$PWD/.tools/bin:$PATH"
          helm template inside-man charts/inside-man \
            --namespace inside-man -f charts/inside-man/values-ha.yaml \
            --set 'tempo-distributed.ingest.kafka.address=kafka.example.svc:9092' \
            --set 'loki.loki.storage.bucketNames.chunks=chunks' \
            --set 'loki.loki.storage.bucketNames.ruler=ruler' \
            > /dev/null

  e2e:
    name: e2e (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One version behind latest is the default, since upstream charts lag;
        # latest is tested too so breakage is caught before users hit it.
        k8s: ["v1.36.4", "v1.37.0"]
    steps:
      - uses: actions/checkout@v5
      - name: Run end-to-end suite
        run: make e2e KIND_IMAGE=kindest/node:${{ matrix.k8s }}
      - name: Dump cluster state on failure
        if: failure()
        run: |
          export PATH="$PWD/.tools/bin:$PATH" KUBECONFIG="$PWD/kubeconfig"
          kubectl get pods -A
          kubectl describe pods -n inside-man
          kubectl logs -n inside-man -l app.kubernetes.io/name=alloy --tail=200 --all-containers || true
