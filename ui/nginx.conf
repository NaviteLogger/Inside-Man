server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API and the UI share an origin, so no CORS and one cookie domain when
    # oauth2-proxy fronts both.
    location /api/ {
        proxy_pass http://${BFF_HOST}:${BFF_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Client-side routes such as /diagnostics have no file behind them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
