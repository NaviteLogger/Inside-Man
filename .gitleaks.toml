# Inside Man secret-scanning config.
[extend]
useDefault = true

[allowlist]
description = "Build artifacts and vendored upstream code"
paths = [
  # Pinned toolchain from scripts/bootstrap.sh. Go's source tree ships crypto
  # test fixtures that trip the generic-api-key and private-key rules.
  '''^\.tools/''',
  # Generated by `make cluster`; contains the kind CA key. Git-ignored.
  '''^kubeconfig$''',
  # Vendored upstream chart tarballs, see ADR 0009.
  '''^charts/inside-man/charts/.*\.tgz$''',
]
