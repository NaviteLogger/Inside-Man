# Inside Man secret-scanning config.
[extend]
useDefault = true

[allowlist]
description = "Paths that are build artifacts or vendored upstream, not our source"
paths = [
  # Pinned toolchain installed by scripts/bootstrap.sh. Go's own source tree
  # ships crypto test fixtures that trip the generic-api-key and private-key
  # rules — 123 findings, none of them ours.
  '''^\.tools/''',
  # Generated by `make cluster`; contains the kind CA key. Git-ignored.
  '''^kubeconfig$''',
  # Vendored upstream chart tarballs (ADR 0009). Opaque archives.
  '''^charts/inside-man/charts/.*\.tgz$''',
]
