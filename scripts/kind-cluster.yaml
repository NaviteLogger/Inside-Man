# Single-node kind cluster for local development and e2e.
#
# One node, because this devcontainer runs with
# fs.inotify.max_user_instances=128 and a read-only /proc/sys, and multi-node
# kind clusters exhaust that limit. See docs/decisions/0010-single-node-kind.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: inside-man
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Lets an ingress controller schedule here later.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080   # UI / oauth2-proxy
        hostPort: 8080
        protocol: TCP
      - containerPort: 30030   # Grafana
        hostPort: 3000
        protocol: TCP
