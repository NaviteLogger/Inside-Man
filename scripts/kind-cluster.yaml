# Single-node kind cluster for local development and e2e.
#
# Single-node is deliberate: this devcontainer runs with
# fs.inotify.max_user_instances=128 and a read-only /proc/sys, so we cannot
# raise the limit that multi-node kind clusters exhaust. See
# docs/decisions/0010-single-node-kind.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: inside-man
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Label the node so ingress-nginx (or any future ingress) can schedule.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080   # UI / oauth2-proxy
        hostPort: 8080
        protocol: TCP
      - containerPort: 30030   # Grafana
        hostPort: 3000
        protocol: TCP
